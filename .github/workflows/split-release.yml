name: Split Release

on:
  push:
    branches:
      - master
    paths:
      - '.changelog/v*.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Version for every distribution (PEP 440, e.g. 5.0.45.post1)"
        required: true
      packages:
        description: "Modules/distributions to build, comma-separated; empty = all 137"
        required: false
        default: ""
      target:
        description: "Upload target"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine requests packaging

      - name: Resolve version
        id: resolve
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            # push 触发：从本次提交携带的 .changelog/v<ver>.md 文件名取版本
            changed=$(git diff --name-only HEAD^ HEAD -- '.changelog/v*.md' | head -1)
            if [ -n "$changed" ]; then
              version=$(basename "$changed" .md | sed 's/^v//')
            fi
          fi
          if [ -z "$version" ]; then
            # 兜底：meta.json.lasted（codegen autoUpdateVersion 维护）
            version=$(python3 -c 'import json; print(json.load(open("meta.json"))["lasted"])')
          fi
          echo "resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate manifest
        run: python3 scripts/build_split_packages.py validate

      - name: Build distributions
        run: |
          args=()
          if [ -n "${{ inputs.packages }}" ]; then
            IFS=',' read -ra pkgs <<< "${{ inputs.packages }}"
            for p in "${pkgs[@]}"; do args+=(--package "$p"); done
          fi
          python3 scripts/build_split_packages.py build \
            --version "${{ steps.resolve.outputs.version }}" \
            --output-dir dist/split \
            "${args[@]}"

      - name: Twine check
        run: python3 -m twine check dist/split/*

      - name: Install and import check
        run: |
          python -m venv /tmp/venv
          if [ -z "${{ inputs.packages }}" ]; then
            # 全量构建：元包 + 全部产品包都在本地，直接整目录安装
            /tmp/venv/bin/pip install dist/split/*.whl
            /tmp/venv/bin/python scripts/verify_split_install.py \
              --manifest split-packages.json \
              --version "${{ steps.resolve.outputs.version }}" \
              --expect-meta
          else
            # 子集构建：元包 install_requires 锁定全部产品包，
            # 本地只有子集时不能安装元包，只装 core + 产品包（volcenginesdk_* 前缀）
            /tmp/venv/bin/pip install dist/split/volcenginesdk_*.whl
            IFS=',' read -ra pkgs <<< "${{ inputs.packages }}"
            args=()
            for p in "${pkgs[@]}"; do
              [ "$p" = "volcengine-python-sdk" ] && continue
              args+=(--package "$p")
            done
            /tmp/venv/bin/python scripts/verify_split_install.py \
              --manifest split-packages.json \
              --version "${{ steps.resolve.outputs.version }}" \
              "${args[@]}"
          fi

      - name: Upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          case "${{ inputs.target }}" in
            testpypi) idx=https://test.pypi.org ;;
            pypi) idx=https://pypi.org ;;
          esac
          # push 触发（target 输入为空）默认发 TestPyPI；正式发布用 workflow_dispatch 选 pypi
          if [ -z "${{ inputs.target }}" ]; then idx=https://test.pypi.org; fi
          python3 scripts/upload_split_packages.py dist/split \
            --repository "${{ inputs.target || 'testpypi' }}" \
            --index-url "$idx"

      - name: Verify public index
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          case "${{ inputs.target }}" in
            testpypi) idx=https://test.pypi.org/simple/ ;;
            pypi) idx=https://pypi.org/simple/ ;;
            *) idx=https://test.pypi.org/simple/ ;;
          esac
          python -m venv /tmp/idx-venv
          # 外部依赖只从正式 PyPI 装，避免 --extra-index-url 混用拉到同名第三方包
          /tmp/idx-venv/bin/pip install --index-url https://pypi.org/simple/ \
            certifi python-dateutil six urllib3
          if [ -z "${{ inputs.packages }}" ]; then
            # 全量发布：元包的 137 个 == 锁定全部从目标索引解析（TestPyPI 索引有
            # 分钟级延迟，重试到可见为止）
            for i in $(seq 1 15); do
              if /tmp/idx-venv/bin/pip install --no-deps --index-url "$idx" \
                   "volcengine-python-sdk==${{ steps.resolve.outputs.version }}"; then break; fi
              echo "meta not visible yet, retry $i/15"; sleep 20
            done
            /tmp/idx-venv/bin/python scripts/verify_split_install.py \
              --manifest split-packages.json \
              --version "${{ steps.resolve.outputs.version }}" \
              --expect-meta
          else
            # 子集发布：--no-deps 从目标索引装本次上传的包并复验
            IFS=',' read -ra pkgs <<< "${{ inputs.packages }}"
            # core 是所有产品包的运行时依赖，子集构建也会上传，需一并安装
            for i in $(seq 1 15); do
              if /tmp/idx-venv/bin/pip install --no-deps --index-url "$idx" \
                   "volcenginesdk-core==${{ steps.resolve.outputs.version }}"; then break; fi
              echo "volcenginesdk-core not visible yet, retry $i/15"; sleep 20
            done
            for p in "${pkgs[@]}"; do
              case "$p" in
                volcenginesdk-*) dist="$p" ;;
                volcenginesdk*) dist="volcenginesdk-${p#volcenginesdk}" ;;
                *) dist="$p" ;;
              esac
              for i in $(seq 1 15); do
                if /tmp/idx-venv/bin/pip install --no-deps --index-url "$idx" \
                     "$dist==${{ steps.resolve.outputs.version }}"; then break; fi
                echo "$dist not visible yet, retry $i/15"; sleep 20
              done
            done
            args=()
            for p in "${pkgs[@]}"; do
              [ "$p" = "volcengine-python-sdk" ] && continue
              args+=(--package "$p")
            done
            /tmp/idx-venv/bin/python scripts/verify_split_install.py \
              --manifest split-packages.json \
              --version "${{ steps.resolve.outputs.version }}" \
              "${args[@]}"
          fi
